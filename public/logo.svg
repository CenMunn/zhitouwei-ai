<?xml version="1.0" encoding="utf-8"?>
<!-- 智投委 AI · 品牌标识「共识核 Consensus Core」
     语义：六边形智能体晶格（6 席位节点）× 内核递升 K 线 × 信号决策流（3 信号节点）= 9 Agent
     金色晶格 = 金融权威 · 绿色决策线 = 多头裁决输出 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="au" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EACB77"/>
      <stop offset="1" stop-color="#C08F30"/>
    </linearGradient>
    <linearGradient id="sig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2FA97C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#43E39F"/>
    </linearGradient>
  </defs>

  <!-- 深墨蓝终端底 -->
  <rect width="64" height="64" rx="14" fill="#0C1220"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#EACB77" stroke-opacity="0.2"/>

  <g transform="translate(8 8)">
    <!-- 智能体晶格：外框 + 内层协作边界 -->
    <path d="M24 4 41.32 14v20L24 44 6.68 34V14L24 4Z" fill="none" stroke="url(#au)" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M24 8 37.86 16v16L24 40 10.14 32V16L24 8Z" fill="none" stroke="url(#au)" stroke-width="0.9" stroke-linejoin="round" opacity="0.5"/>

    <!-- 六席位节点 -->
    <g fill="url(#au)">
      <circle cx="24" cy="4" r="1.7"/>
      <circle cx="41.32" cy="14" r="1.7"/>
      <circle cx="41.32" cy="34" r="1.7"/>
      <circle cx="24" cy="44" r="1.7"/>
      <circle cx="6.68" cy="34" r="1.7"/>
      <circle cx="6.68" cy="14" r="1.7"/>
    </g>

    <!-- 量化 K 线：三根递升 -->
    <line x1="17" y1="25.5" x2="17" y2="33.5" stroke="url(#au)" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>
    <rect x="15.7" y="27" width="2.6" height="5" rx="0.5" fill="url(#au)" opacity="0.45"/>
    <line x1="24" y1="21" x2="24" y2="30.5" stroke="url(#au)" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
    <rect x="22.7" y="22.5" width="2.6" height="6.5" rx="0.5" fill="url(#au)" opacity="0.7"/>
    <line x1="31" y1="15.5" x2="31" y2="27.5" stroke="url(#au)" stroke-width="1.3" stroke-linecap="round"/>
    <rect x="29.7" y="17" width="2.6" height="9" rx="0.5" fill="url(#au)"/>

    <!-- 信号决策流：数据 → 洞察 → CIO 裁决 -->
    <polyline points="17 25.5 24 21 31 15.5" fill="none" stroke="url(#sig)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="17" cy="25.5" r="1.9" fill="#43E39F" opacity="0.7"/>
    <circle cx="24" cy="21" r="1.9" fill="#43E39F" opacity="0.85"/>
    <circle cx="31" cy="15.5" r="3.8" fill="none" stroke="#43E39F" stroke-width="1" opacity="0.45"/>
    <circle cx="31" cy="15.5" r="2.2" fill="#43E39F"/>
  </g>
</svg>
